[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remify"
version = "0.1.0"
description = "Tool-agnostic, AI-driven triage and remediation for security findings."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.3",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
remify = "remify.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/remify"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
